[project]
name = "envault-gist"
version = "0.1.0"
description = "Securely sync encrypted .env files to GitHub Gists."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Envault Maintainer", email = "maintainer@example.com" }]
dependencies = [
  "PyGithub>=1.58",
  "argon2-cffi>=23.1.0",
  "cryptography>=41.0.0",
  "rich>=13.0.0",
  "tenacity>=8.2.0",
  "typer>=0.9.0",
  "urllib3>=2.2.3",
]

[project.scripts]
envault-gist = "envault_gist.cli:main"

[dependency-groups]
dev = [
  "pytest>=7.0.0",
  "ruff>=0.11.0",
  "pytest-cov>=4.0.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "PLC0415"]

[tool.pytest.ini_options]
addopts = "-v"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
