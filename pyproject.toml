[project]
name = "envault"
version = "0.1.0"
description = "Securely sync encrypted .env files to GitHub Gists."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Envault Maintainer", email = "maintainer@example.com" }]
dependencies = [
  "PyGithub>=1.58",
  "PyNaCl==1.5.0",
  "argon2-cffi>=23.1.0",
  "cryptography>=41.0.0",
  "rich>=13.0.0",
  "tenacity>=8.2.0",
  "typer>=0.9.0",
]

[project.scripts]
envault = "envault.cli:main"

[dependency-groups]
dev = [
  "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
